   "What is compound interest?",
   "Interest earned on your interest. Each period, interest is added to the balance, so the next period’s interest is a little bigger."

   "What is the formula?",
   "A = P × (1 + r/n)^(n × t), where P is the starting amount, r the yearly rate, n how many times a year interest is added, and t the years. Monthly additions are added at the end of each month."

  <div class="row"><div><label class="field-label" for="cur">Currency</label><select class="input" id="cur"><option value="INR">₹ Indian rupee</option><option value="USD">$ US dollar</option><option value="EUR">€ Euro</option><option value="GBP">£ British pound</option><option value="AED">AED UAE dirham</option><option value="CAD">CA$ Canadian dollar</option><option value="AUD">A$ Australian dollar</option><option value="SGD">S$ Singapore dollar</option><option value="SAR">SAR Saudi riyal</option></select></div><div><label class="field-label" for="p">Starting amount</label><input class="input" id="p" type="number" inputmode="decimal" step="100" value="10000"></div><div><label class="field-label" for="add">Monthly addition (optional)</label><input class="input" id="add" type="number" inputmode="decimal" step="10" value="0"></div></div><div class="row"><div><label class="field-label" for="r">Interest rate (% a year)</label><input class="input" id="r" type="number" inputmode="decimal" step="0.05" value="8"></div><div><label class="field-label" for="y">Years</label><input class="input" id="y" type="number" inputmode="decimal" step="1" value="10"></div></div>
