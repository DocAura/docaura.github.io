<div class="panel" data-calc="fd">
  <div class="row"><div><label class="field-label" for="p">Deposit amount (₹)</label><input class="input" id="p" type="number" inputmode="decimal" step="1000" value="100000"></div><div><label class="field-label" for="r">Interest rate (% a year)</label><input class="input" id="r" type="number" inputmode="decimal" step="0.05" value="7"></div></div><div class="row"><div><label class="field-label" for="y">Years</label><input class="input" id="y" type="number" inputmode="decimal" step="1" value="5"></div><div><label class="field-label" for="mo">Extra months</label><input class="input" id="mo" type="number" inputmode="decimal" step="1" value="0"></div></div>
