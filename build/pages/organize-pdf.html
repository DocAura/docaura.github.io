<div class="panel">
  <label class="drop" id="drop">
    <span class="ic">{{ICON:upload:42:#3B2D8F}}</span>
    <b>Tap here to choose a PDF</b>
    <span>or drag it here · stays on your device</span>
    <input type="file" accept="application/pdf,.pdf" aria-label="Choose a PDF">
  </label>

  <div id="opts" hidden style="display:flex;flex-direction:column;gap:18px">
    <div class="row" style="align-items:center">
      <p class="field-label" id="count" style="margin:0;flex:1 1 200px"></p>
      <div style="flex:0 1 auto;display:flex;gap:10px;flex-wrap:wrap">
        <button type="button" class="btn btn-light btn-small" id="rot-all">Turn all pages</button>
        <button type="button" class="btn btn-light btn-small" id="reset">Start over</button>
      </div>
    </div>
    <div class="org-grid" id="grid"></div>
    <button type="button" class="btn btn-big" id="go">Save my PDF {{ICON:arrow:26:#FFFFFF}}</button>
  </div>

  <div class="status" id="status"></div>

  <div class="result" id="result">
    <h2>{{ICON:check:28:#1D6B45}} Your PDF is ready</h2>
    <img class="preview-img" id="out-img" alt="First page of your PDF" hidden>
    <p class="meta" id="out-meta"></p>
    <div class="btns" id="out-btns">
      <button type="button" class="btn" id="dl">{{ICON:download:24:#FFFFFF}} Download PDF</button>
      <button type="button" class="btn btn-light" id="again">Do another PDF</button>
    </div>
  </div>
</div>
<!--howto-->
<section class="section"><h2>How to fix the pages of a PDF</h2>
<div class="steps">
  <div class="step"><span class="num">1</span><b>Choose your PDF</b><span>Every page appears as a small picture.</span></div>
  <div class="step"><span class="num">2</span><b>Fix the pages</b><span>Turn sideways pages, move pages with the arrows, and remove pages you don’t need.</span></div>
  <div class="step"><span class="num">3</span><b>Save</b><span>Check the preview and download your tidy PDF.</span></div>
</div></section>
