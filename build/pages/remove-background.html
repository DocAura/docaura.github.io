<div class="panel">
  <label class="drop" id="drop">
    <span class="ic">{{ICON:passport:42:#3B2D8F}}</span>
    <b>Tap here to choose a photo of a person</b>
    <span>Selfie, passport or profile photo · JPG, PNG or HEIC</span>
    <input type="file" accept="image/*,.heic,.heif" aria-label="Choose a photo">
  </label>
  <div id="opts" hidden style="display:flex;flex-direction:column;gap:20px">
    <div style="text-align:center"><canvas id="pv" class="checker" style="max-width:100%;max-height:420px;border-radius:14px;box-shadow:var(--clay)"></canvas></div>
    <div>
      <span class="field-label" id="bg-l">New background</span>
      <div class="choices" id="bg" role="group" aria-labelledby="bg-l">
        <button type="button" class="choice" data-value="#ffffff" aria-pressed="true">White</button>
        <button type="button" class="choice" data-value="#3d7bd9" aria-pressed="false">Blue</button>
        <button type="button" class="choice" data-value="#d9d9d9" aria-pressed="false">Light grey</button>
        <button type="button" class="choice" data-value="none" aria-pressed="false">Transparent</button>
        <button type="button" class="choice" data-value="custom" aria-pressed="false">Other colour</button>
      </div>
      <input class="input" id="col" type="color" value="#f4d03f" hidden style="margin-top:12px;padding:6px;max-width:160px">
    </div>
    <label style="display:flex;align-items:center;gap:14px;font-weight:700;cursor:pointer;min-height:44px">
      <input type="checkbox" id="sharp" style="width:28px;height:28px;accent-color:#3B2D8F"> Sharper edges
    </label>
    <div class="btns">
      <button type="button" class="btn" id="dl">{{ICON:download:24:#FFFFFF}} Download</button>
      <button type="button" class="btn btn-light" id="again">Another photo</button>
    </div>
  </div>
  <div class="status" id="status"></div>
</div>
